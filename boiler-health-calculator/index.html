<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boiler Health Calculator</title>

  <script type="module" src="assets/js/main.js" defer></script>
</head>

<body>

  <div class="app">
    <div class="steps-panel">

      <div class="organic-selections-container"></div>

      <div class="boiler-rounds-container"></div>

    </div>

    <div class="main-panel">

      <div class="boiler-panel-container">
        <div class="boiler-panel">

          <div class="boiler-health">
            <div class="health-background-layer"></div>
            <div class="health-active-layer"></div>
            <span class="health-number"></span>
          </div>

          <div class="boiler-star">
            <div class="star-select"></div>
          </div>

        </div>
      </div>

      <div class="status-panel-container">
        <div class="status-panel">
          <span class="status-text">Select Organic Gags</span>
        </div>
      </div>

      <div class="attack-grid-container">
        <div class="attack-grid"></div>
      </div>

      <div class="focused-step-container">
        <div class="focused-step"></div>
      </div>

    </div>

  </div>

</body>
</html>
