<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">

  <title>Boiler Health Calculator</title>

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/boiler-panel.css">
  <link rel="stylesheet" href="assets/css/attack-grid.css">
  <link rel="stylesheet" href="assets/css/steps-panel.css">
  <script type="module" src="assets/js/main.js" defer></script>
</head>

<body>

  <div class="app">
    <div class="steps-panel"></div>

    <div class="main-panel">

      <div class="boiler-panel-container">
        <div class="boiler-panel">

          <div class="boiler-health">
            <div class="boiler-health-layer background"></div>
            <div class="boiler-health-layer active"></div>
            <span class="boiler-health-number"></span>
          </div>

          <div class="boiler-star">
            <div class="boiler-star-selector"></div>
          </div>

        </div>
      </div>

      <div class="attack-grid-container">
        <div class="attack-grid"></div>
      </div>

      <div class="focused-step-container">
        <div class="focused-step"></div>
      </div>

    </div>

  </div>

</body>

</html>
